[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerbot"
version = "0.1.0"
description = "6-max NLH hybrid GTO + exploitation poker ML system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.1",
    "datasets>=2.16",
    "huggingface_hub>=0.20",
    "tqdm>=4.66",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
aof = [
    "pokerkit>=0.5.0,<1",
    "phevaluator>=0.5.0,<1",
    "numba>=0.59.0,<1",
    "numpy>=1.26.0,<3",
    "pyyaml>=6.0",
]
weva = ["faiss-cpu>=1.7.4", "scikit-learn>=1.3"]
llm = [
    "transformers>=4.40",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "sentencepiece>=0.2",
]
live = [
    "mss>=9.0",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "easyocr>=1.7",
    "pytesseract>=0.3.10",
    "UnityPy>=1.10",
]
vl = [
    "instructor>=1.6",
    "openai>=1.30",
    "pydantic>=2.6",
    "pillow>=10.0",
    "mss>=9.0",
    "opencv-python>=4.8",
]
aof-native = [
    "pybind11>=2.11",
]
cfr = [
    "jax[cpu]>=0.4.28",
    "flax>=0.8",
    "optax>=0.2",
    "chex>=0.1.86",
]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[tool.setuptools]
py-modules = [
    "aof",
    "aof_confidence",
    "aof_game_config",
    "aof_parse",
    "aof_ranges",
    "aof_ranges_chart",
    "aof_ranges_gto",
    "aof_equity",
    "aof_equity_grids",
    "aof_equity_score2",
    "aof_equity_showdown",
    "aof_spot",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pokerbot*", "aof_rl*", "aof_solver*", "aof_validation*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full CFR solve or long scripted RL rollouts (skip with -m 'not slow')",
]
