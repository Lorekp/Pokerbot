[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerbot"
version = "0.1.0"
description = "Offline poker simulation, strategy learning and evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.1",
    "datasets>=2.16",
    "huggingface_hub>=0.20",
    "tqdm>=4.66",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-timeout>=2.3"]
aof = [
    "pokerkit>=0.5.0,<1",
    "phevaluator==0.5.3.1",
    "numba>=0.59.0,<1",
    "numpy>=1.26.0,<3",
    "pyyaml>=6.0",
]
weva = ["faiss-cpu>=1.7.4", "scikit-learn>=1.3"]
llm = [
    "transformers>=4.40",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "sentencepiece>=0.2",
]
aof-native = [
    "pybind11>=2.11",
]
cfr = [
    "jax[cpu]>=0.4.28",
    "flax>=0.8",
    "optax>=0.2",
    "chex>=0.1.86",
]
aof-cfr = [
    "open-spiel>=1.6",
    "numpy>=1.26.0,<3",
    "pokerkit>=0.5.0,<1",
    "phevaluator==0.5.3.1",
    "numba>=0.59.0,<1",
]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
    "tiktoken>=0.7",
]

[tool.setuptools]
py-modules = [
    "aof",
    "aof_confidence",
    "aof_equity",
    "aof_equity_cache",
    "aof_equity_config",
    "aof_equity_grids",
    "aof_equity_score2",
    "aof_equity_showdown",
    "aof_game_config",
    "aof_multiway",
    "aof_parse",
    "aof_ranges",
    "aof_ranges_chart",
    "aof_ranges_gto",
    "aof_ranges_tight",
    "aof_spot",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pokerbot*", "aof_rl*", "aof_solver*", "aof_cfr*", "aof_validation*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Per-test wall-clock cap so a single hanging test can't stall the whole suite (a full `pytest tests/`
# run once wedged for hours on a blocking test). 600s is generous enough for the heavy CFR/search/RL
# tests; a genuinely stuck test is killed and named instead of hanging. `thread` method works on Windows
# (the default `signal` method needs SIGALRM, which Windows lacks). Override per-test with
# `@pytest.mark.timeout(N)` (0 disables).
timeout = 600
timeout_method = "thread"
markers = [
    "slow: full CFR solve or long scripted RL rollouts (skip with -m 'not slow')",
]
