[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerbot"
version = "0.1.0"
description = "6-max NLH hybrid GTO + exploitation poker ML system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.1",
    "datasets>=2.16",
    "huggingface_hub>=0.20",
    "tqdm>=4.66",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
weva = ["faiss-cpu>=1.7.4", "scikit-learn>=1.3"]
llm = [
    "transformers>=4.40",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "sentencepiece>=0.2",
]
live = [
    "mss>=9.0",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "easyocr>=1.7",
]
cfr = [
    "jax[cpu]>=0.4.28",
    "flax>=0.8",
    "optax>=0.2",
    "chex>=0.1.86",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pokerbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
