experiment: aof_v3_ppo_league
obs_version: 3
teacher_version: 2
seed: 42
device: cuda
allow_cpu: false
out: checkpoints/aof_rl/policy_league_v3.pt

model:
  encoder: set_transformer_lite
  d_model: 96
  n_blocks: 2
  n_heads: 4
  n_inducing: 8
  trunk_hidden: 128

train:
  algo: ppo_league
  gamma: 1.0
  gae_lambda: 1.0
  lr: 0.0003
  clip_ratio: 0.10
  entropy_coef: 0.01
  value_coef: 0.5
  q_coef: 0.5
  teacher_bc_coef: 0.25
  uncertainty_coef: 0.1
  batch_hands: 128
  epochs_per_update: 4
  total_updates: 999999
  teacher_samples: 300
  payoff_samples: 1200
  # HU terminal equity: combo-exact table (payoff_samples applies to multiway MC only)
  payoff_hu_mode: table
  hu_showdown_table_path: data/aof/hu_showdown_equity.npz
  use_fast_teacher: true
  normalize_advantages: true
  stack_bb: 8.0
  save_checkpoint_on_best: true
  # min_bb_hand_improvement: 0.05  # optional: reduce checkpoint churn
  use_teacher_lut: true
  teacher_lut_path: data/aof/teacher_lut_v2_8bb.npz
  use_batched_rollout: true
  parallel_hands: 64
  store_obs_on_cpu: false
  mixed_precision: false
  torch_compile_villain: false
  torch_compile_hero: false

league:
  main_pool_size: 8
  archive_top_k: 8
  scripted_pool: true
  oracle_pool: true
  adversarial_br_pool: true
  snapshot_every_updates: 50
  best_response_every_updates: 200
  br_train_steps: 32

curriculum:
  stage_1: hu_only
  stage_1_updates: 40
  stage_2: three_handed_one_shover
  stage_2_updates: 40
  stage_3: multiway_shovers
  stage_3_updates: 40
  stage_4: four_handed_full
  stage_4_updates: 60
  stage_5: rake_randomized
  stage_5_updates: 40

validation:
  seeds: [1, 2, 3, 4, 5]
  paired_eval_hands: 0
  deterministic: false
