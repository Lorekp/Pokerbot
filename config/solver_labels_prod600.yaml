# Production expansion — 600 converged labels (50 boards × 3 spots × 2 heroes × 2 stacks).
# Same convergence config and range scopes as prod60.

seed: 42

stack_depths_bb: [40, 100]

boards:
  strategy: stratified_sample
  count: 50
  seed: 600
  exclude_boards:
    - "Td9d6h"
    - "Ah7c2s"
    - "Ks8h3d"
    - "QcJh4s"
    - "8c7d2h"

bet_tree:
  pot_fractions: [0.50]
  include_all_in: true
  raise_multiplier: 2.5

solver:
  max_iterations: 10000
  target_exploitability_pct: 0.5
  timeout_sec: 3600
  include_unconverged: false
  chip_unit_bb: 100

decision_nodes:
  sample_roots: true
  sample_action_paths: false
  max_nodes_per_board: 1

ranges:
  default_oop: "QQ+,AK"
  default_ip: "TT-22,AQs+"
  bunching_oop: "TT+,AQs+"
  bunching_ip: "99-22,ATs+"

hero_hands:
  - ["Ah", "Kd"]
  - ["Qs", "Qh"]

spots:
  - id: sb_vs_bb_flop
    oop_position: SB
    ip_position: BB
    bunching: false
    preflop_line: fold_to_sb_bb_limp

  - id: btn_vs_bb_flop
    oop_position: BB
    ip_position: BTN
    bunching: false
    preflop_line: btn_open_bb_call

  - id: bunching_postflop
    oop_position: BB
    ip_position: BTN
    bunching: true
    folded_seats: [0, 1, 2]
    preflop_line: btn_open_bb_call
